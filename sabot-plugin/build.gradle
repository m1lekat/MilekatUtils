plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group 'fr.milekat.sabot'
version rootProject.version

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    // The lib under test — always the current worktree source, never a published version.
    implementation project(':')

    compileOnly 'io.papermc.paper:paper-api:26.2.build.112-stable'
    compileOnly group: 'org.jetbrains', name: 'annotations', version: '26.0.2'

    // Bundled instead of left to Paper's library loader: it only resolves Maven Central,
    // and this jar is meant to run a SNAPSHOT that was never published anywhere.
    implementation group: 'com.rabbitmq', name: 'amqp-client', version: '5.26.0'
}

compileJava.options.encoding = 'UTF-8'

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    getArchiveClassifier().set(null)
    getArchiveBaseName().set('MilekatSabot')
}

jar {
    actions = []
    dependsOn('shadowJar')
}
